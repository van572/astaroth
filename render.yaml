services:
  - type: web
    name: controlqr-asistencia
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.21.1
      - key: SMTP_ENCRYPTION_KEY
        generateValue: true
      - key: INITIAL_ADMIN_PIN
        value: "1234"
      - key: EMAIL_PROVIDER
        value: "smtp"
      - key: SMTP_PORT
        value: "2587"
      - key: SMTP_SECURE
        value: "false"
